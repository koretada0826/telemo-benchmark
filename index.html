<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TELEMO｜AI営業を導入したい人は、このページを閉じてください。</title>
  <meta name="description" content="私たちが作ったのはAIではありません。営業です。営業会社が10年以上かけて磨いた営業を、AIに移植しました。">
  <link rel="preload" href="images/section1.jpg" as="image">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .section {
      position: relative;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .section img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CTA Button */
    .cta-wrapper {
      background: #000;
      padding: 40px 24px;
      text-align: center;
      max-width: 540px;
      margin: 0 auto;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: transparent;
      color: #C5A55A;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 52px;
      border: 1.5px solid #C5A55A;
      border-radius: 60px;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .cta-button:hover {
      background: rgba(197, 165, 90, 0.1);
      box-shadow: 0 0 24px rgba(197, 165, 90, 0.15);
    }

    .cta-button:active {
      background: rgba(197, 165, 90, 0.15);
    }

    .cta-label {
      display: block;
      color: #555;
      font-size: 11px;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    .cta-play {
      font-size: 13px;
      opacity: 0.8;
    }

    /* Responsive: tablet and desktop */
    @media (min-width: 541px) {
      body {
        background: #000;
      }
    }

    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>

  <!-- Section 1: Hero -->
  <div class="section">
    <img src="images/section1.jpg" width="732" height="1334" alt="AI営業を導入したい人は、このページを閉じてください。私たちが作ったのはAIではありません。営業です。" loading="eager" fetchpriority="high">
  </div>

  <!-- Section 2: AIは営業できません -->
  <div class="section">
    <img src="images/section2.jpg" width="722" height="1316" alt="AIは営業できません。営業ができるAIだけが営業できます。営業は会話ではなく設計だからです。" loading="lazy">
  </div>

  <!-- Section 3: AI会社 vs TELEMO + 数式 -->
  <div class="section">
    <img src="images/section3.jpg" width="730" height="1318" alt="AI会社が作る営業AI vs TELEMO。営業は才能じゃない。数式です。" loading="lazy">
  </div>

  <!-- Section 4: AI社員 -->
  <div class="section">
    <img src="images/section4.jpg" width="736" height="1350" alt="AIだから売れる。ではありません。営業だから売れる。AI社員という概念。" loading="lazy">
  </div>

  <!-- CTA after Section 4 -->
  <div class="cta-wrapper">
    <span class="cta-label">無料</span>
    <a href="#" class="cta-button" id="cta-4">
      音声を聞く <span class="cta-play">▶</span>
    </a>
  </div>

  <!-- Section 5: 営業会社が作っている + 13,200コール -->
  <div class="section">
    <img src="images/section5.jpg" width="734" height="1342" alt="TELEMOは営業会社が作っています。毎月13,200コール。営業社員約3人分。" loading="lazy">
  </div>

  <!-- CTA after Section 5 -->
  <div class="cta-wrapper">
    <span class="cta-label">無料</span>
    <a href="#" class="cta-button" id="cta-5">
      音声を聞く <span class="cta-play">▶</span>
    </a>
  </div>

  <!-- Section 6: コスト比較 + 感情リスク -->
  <div class="section">
    <img src="images/section6.jpg" width="746" height="1344" alt="人を雇うか。TELEMOを入れるか。同じ35万円。片方は辞める。片方は辞めない。" loading="lazy">
  </div>

  <!-- CTA after Section 6 -->
  <div class="cta-wrapper">
    <span class="cta-label">無料</span>
    <a href="#" class="cta-button" id="cta-6">
      音声を聞く <span class="cta-play">▶</span>
    </a>
  </div>

  <!-- Section 7: Mission + CTA -->
  <div class="section">
    <img src="images/section7.jpg" width="632" height="1340" alt="AIを売りたい会社ではありません。営業を勝たせたい会社です。音声を聞く。" loading="lazy">
  </div>

</body>
</html>
